# This file contains default configuration settings for the Redfish Mockup Creator
# All settings can be overridden by command-line arguments

[Authentication]
# The user name for authentication (required if not provided via command line)
user =

# The password for authentication (required if not provided via command line)
password =

[Connection]
# The IP address (and port) of the Redfish service (required if not provided via command line)
rhost =

# Use HTTPS for all operations (true/false)
Secure = false

# Authentication mode (None, Basic, Session)
Auth = Session

[Output]
# Output directory for the mockup
Dir = rfMockUpDfltDir

# Mockup description to add to the output readme file
description = 

# Copyright string to add to each resource
Copyright = 

[Options]
# Capture the response headers in the mockup (true/false)
Headers = false

# Capture the time of each GET in the mockup (true/false)
Time = false

# Quiet mode; progress messages suppressed (true/false)
quiet = false

# Enable tracing; creates the file rf-mockup-create.log in the output directory (true/false)
trace = false

# The maximum number of log entries to collect in each log service
# Leave empty or 0 for no limit
maxlogentries =

# Force rename URIs containing characters that are disallowed in Windows folder names (true/false)
forcefolderrename = false
